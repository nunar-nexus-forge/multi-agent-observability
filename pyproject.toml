[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-observability"
version = "0.1.0"
description = "MA-Trace: causal tracing, coordination SLOs and deterministic replay for multi-agent LLM systems (multi-agent observability on OpenTelemetry)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "nunar-nexus-forge" }]
keywords = [
  "multi-agent-observability",
  "observability", "opentelemetry", "multi-agent", "llm", "agents", "tracing",
  "replay", "langgraph", "crewai", "autogen", "slo",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.20"]
prometheus = ["prometheus-client>=0.17"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
crewai = ["crewai>=0.100"]
autogen = ["autogen-agentchat>=0.4"]
all = [
  "opentelemetry-exporter-otlp-proto-http>=1.20",
  "prometheus-client>=0.17",
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[project.scripts]
ma-trace = "ma_trace.cli:main"

[project.urls]
Homepage = "https://github.com/nunar-nexus-forge/multi-agent-observability"
Documentation = "https://github.com/nunar-nexus-forge/multi-agent-observability/tree/main/docs"
Changelog = "https://github.com/nunar-nexus-forge/multi-agent-observability/blob/main/CHANGELOG.md"
Issues = "https://github.com/nunar-nexus-forge/multi-agent-observability/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "prometheus-client>=0.17",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]
frameworks = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_trace"]

[tool.hatch.build.targets.sdist]
include = ["src/ma_trace", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012", "SIM108", "B905", "RUF005", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
files = ["src/ma_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ma_trace"]
